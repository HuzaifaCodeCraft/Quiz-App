<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Quiz App</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="card">

    <!-- Start screen -->
    <section id="start-screen" class="screen active">
      <div class="logo">?</div>
      <h1>Web Dev Quiz</h1>
      <p class="muted">Test your HTML, CSS and JavaScript knowledge. Answer each question, then see your final score.</p>
      <button id="start-btn" class="btn primary">Start Quiz</button>
    </section>

    <!-- Quiz screen -->
    <section id="quiz-screen" class="screen">
      <div class="top">
        <span id="question-count">Question 1 / 1</span>
        <span id="live-score">Score: 0</span>
      </div>
      <div class="progress" aria-hidden="true"><div id="progress-bar"></div></div>

      <h2 id="question-text"></h2>
      <div id="options" class="options" role="group" aria-label="Answer choices"></div>

      <p id="feedback" class="feedback" aria-live="polite"></p>
      <button id="next-btn" class="btn primary" disabled>Next</button>
    </section>

    <!-- Result screen -->
    <section id="result-screen" class="screen">
      <div class="logo" id="result-emoji">🏆</div>
      <h1>Quiz Completed!</h1>
      <p class="score-big"><span id="final-score">0</span> / <span id="total-questions">0</span></p>
      <p id="result-message" class="muted"></p>
      <button id="restart-btn" class="btn primary">Restart Quiz</button>
    </section>

  </main>
  <script src="app.js"></script>
</body>
</html>
